# Held-out evaluation set v2 — FROZEN.
#
# Written before any change made after the v1 held-out results, and never used for tuning.
# Rules:
#   * Do not edit this file to fix a failure. A failing question is information, not a bug.
#     (tests/test_holdout_frozen.py pins its hash; changing it must be a deliberate, reviewed decision.)
#   * Do not read assistant failures on these questions while changing prompts, metric views or examples.
#   * Every question states its own definitions. "Net revenue" = sum of order_items.line_total over orders
#     whose status is not 'Cancelled'. "Today" = 2026-06-30.
#   * Reference SQL targets base tables and was executed against the deterministic seed; every answer is
#     non-empty and has no ties at a LIMIT boundary.

- id: h2-01
  domain: sales
  question: >-
    For each product category, compare net revenue (sum of order line totals, excluding cancelled orders) for
    January-June 2025 with January-June 2026. Show category, H1 2025 revenue, H1 2026 revenue and the
    percentage change.
  order_matters: false
  reference_sql: |
    SELECT p.category,
           SUM(CASE WHEN o.order_date BETWEEN DATE'2025-01-01' AND DATE'2025-06-30' THEN oi.line_total END) AS h1_2025,
           SUM(CASE WHEN o.order_date BETWEEN DATE'2026-01-01' AND DATE'2026-06-30' THEN oi.line_total END) AS h1_2026,
           ROUND((SUM(CASE WHEN o.order_date BETWEEN DATE'2026-01-01' AND DATE'2026-06-30' THEN oi.line_total END)
                - SUM(CASE WHEN o.order_date BETWEEN DATE'2025-01-01' AND DATE'2025-06-30' THEN oi.line_total END)) * 100.0
                / SUM(CASE WHEN o.order_date BETWEEN DATE'2025-01-01' AND DATE'2025-06-30' THEN oi.line_total END), 2) AS pct_change
    FROM ${catalog}.sales.order_items oi
    JOIN ${catalog}.sales.orders o ON o.order_id = oi.order_id
    JOIN ${catalog}.sales.products p ON p.product_id = oi.product_id
    WHERE o.status <> 'Cancelled'
    GROUP BY p.category

- id: h2-02
  domain: sales
  question: >-
    Show the cumulative (running total) net revenue by month for 2025, where net revenue is the sum of order line
    totals excluding cancelled orders. Show the month and the running total.
  order_matters: true
  reference_sql: |
    WITH m AS (
      SELECT date_trunc('MONTH', o.order_date) AS month, SUM(oi.line_total) AS rev
      FROM ${catalog}.sales.order_items oi JOIN ${catalog}.sales.orders o ON o.order_id = oi.order_id
      WHERE o.status <> 'Cancelled' AND year(o.order_date) = 2025
      GROUP BY ALL
    )
    SELECT month, SUM(rev) OVER (ORDER BY month) AS running_total FROM m ORDER BY month

- id: h2-03
  domain: sales
  question: >-
    For each customer region, which 3 products have the highest net revenue (sum of order line totals,
    excluding cancelled orders)? Show region, product name and net revenue.
  order_matters: false
  reference_sql: |
    WITH r AS (
      SELECT c.region, p.product_name, SUM(oi.line_total) AS net_revenue
      FROM ${catalog}.sales.order_items oi
      JOIN ${catalog}.sales.orders o ON o.order_id = oi.order_id
      JOIN ${catalog}.sales.customers c ON c.customer_id = o.customer_id
      JOIN ${catalog}.sales.products p ON p.product_id = oi.product_id
      WHERE o.status <> 'Cancelled'
      GROUP BY ALL
    )
    SELECT region, product_name, net_revenue FROM (
      SELECT *, ROW_NUMBER() OVER (PARTITION BY region ORDER BY net_revenue DESC) AS rn FROM r
    ) WHERE rn <= 3

- id: h2-04
  domain: sales
  question: >-
    Of the customers whose first non-cancelled order was placed in 2025, how many placed another non-cancelled
    order within 90 days after that first order, and what percentage of the 2025 first-time customers is that?
  order_matters: false
  reference_sql: |
    WITH ord AS (
      SELECT customer_id, order_date FROM ${catalog}.sales.orders WHERE status <> 'Cancelled'
    ), firsts AS (
      SELECT customer_id, MIN(order_date) AS first_date FROM ord GROUP BY customer_id
    ), cohort AS (
      SELECT f.customer_id,
             MAX(CASE WHEN o.order_date > f.first_date AND o.order_date <= date_add(f.first_date, 90) THEN 1 ELSE 0 END) AS returned
      FROM firsts f JOIN ord o ON o.customer_id = f.customer_id
      WHERE year(f.first_date) = 2025
      GROUP BY f.customer_id
    )
    SELECT SUM(returned) AS returned_within_90_days, ROUND(AVG(returned) * 100, 2) AS pct_returned FROM cohort

- id: h2-05
  domain: sales
  question: >-
    How many customers placed no non-cancelled order between 2026-01-01 and 2026-06-30?
  order_matters: false
  reference_sql: |
    SELECT COUNT(*) AS customers_without_orders
    FROM ${catalog}.sales.customers c
    WHERE NOT EXISTS (
      SELECT 1 FROM ${catalog}.sales.orders o
      WHERE o.customer_id = c.customer_id AND o.status <> 'Cancelled'
        AND o.order_date BETWEEN DATE'2026-01-01' AND DATE'2026-06-30'
    )

- id: h2-06
  domain: sales
  question: >-
    Excluding cancelled orders, what is the average order total amount for orders that used a promotion and for
    orders that did not? Return a single row with both averages.
  order_matters: false
  reference_sql: |
    SELECT ROUND(AVG(CASE WHEN promo_id IS NOT NULL THEN total_amount END), 2) AS avg_with_promo,
           ROUND(AVG(CASE WHEN promo_id IS NULL THEN total_amount END), 2) AS avg_without_promo
    FROM ${catalog}.sales.orders
    WHERE status <> 'Cancelled'

- id: h2-07
  domain: sales
  question: >-
    For delivered orders, what is the average number of days from order date to delivery date in each store
    region?
  order_matters: false
  reference_sql: |
    SELECT s.region, ROUND(AVG(datediff(o.delivery_date, o.order_date)), 2) AS avg_delivery_days
    FROM ${catalog}.sales.orders o JOIN ${catalog}.sales.stores s ON s.store_id = o.store_id
    WHERE o.delivery_date IS NOT NULL
    GROUP BY s.region

- id: h2-08
  domain: sales
  question: >-
    What share of 2025 net revenue (sum of order line totals, excluding cancelled orders) came from each sales
    channel type, as a percentage of the 2025 total?
  order_matters: false
  reference_sql: |
    WITH t AS (
      SELECT ch.channel_type, SUM(oi.line_total) AS rev
      FROM ${catalog}.sales.order_items oi
      JOIN ${catalog}.sales.orders o ON o.order_id = oi.order_id
      JOIN ${catalog}.sales.sales_channels ch ON ch.channel_id = o.channel_id
      WHERE o.status <> 'Cancelled' AND year(o.order_date) = 2025
      GROUP BY ALL
    )
    SELECT channel_type, ROUND(rev * 100.0 / SUM(rev) OVER (), 2) AS pct_of_revenue FROM t

- id: h2-09
  domain: sales
  question: >-
    What is the average number of order lines per non-cancelled order for each customer segment?
  order_matters: false
  reference_sql: |
    WITH per_order AS (
      SELECT o.order_id, c.segment, COUNT(oi.order_item_id) AS lines
      FROM ${catalog}.sales.orders o
      JOIN ${catalog}.sales.customers c ON c.customer_id = o.customer_id
      JOIN ${catalog}.sales.order_items oi ON oi.order_id = o.order_id
      WHERE o.status <> 'Cancelled'
      GROUP BY ALL
    )
    SELECT segment, ROUND(AVG(lines), 2) AS avg_lines_per_order FROM per_order GROUP BY segment

- id: h2-10
  domain: sales
  question: >-
    Using only the most recent inventory snapshot for each product and store combination, how many
    product-store combinations have quantity on hand at or below their reorder point, by store region?
  order_matters: false
  reference_sql: |
    WITH latest AS (
      SELECT i.*, ROW_NUMBER() OVER (PARTITION BY product_id, store_id ORDER BY snapshot_date DESC, inventory_id DESC) AS rn
      FROM ${catalog}.sales.inventory i
    )
    SELECT s.region, COUNT(*) AS at_or_below_reorder
    FROM latest l JOIN ${catalog}.sales.stores s ON s.store_id = l.store_id
    WHERE l.rn = 1 AND l.quantity_on_hand <= l.reorder_point
    GROUP BY s.region

- id: h2-11
  domain: sales
  question: >-
    Among customers with at least one non-cancelled order, what percentage have eight or more non-cancelled
    orders, for each customer segment?
  order_matters: false
  reference_sql: |
    WITH n AS (
      SELECT c.segment, o.customer_id, COUNT(*) AS orders
      FROM ${catalog}.sales.orders o JOIN ${catalog}.sales.customers c ON c.customer_id = o.customer_id
      WHERE o.status <> 'Cancelled'
      GROUP BY ALL
    )
    SELECT segment, ROUND(AVG(CASE WHEN orders >= 8 THEN 1.0 ELSE 0.0 END) * 100, 2) AS pct_eight_plus FROM n GROUP BY segment

- id: h2-12
  domain: sales
  question: >-
    Which 5 stores had the highest net revenue in 2025 (sum of order line totals, excluding cancelled orders)?
    Show store name and net revenue.
  order_matters: true
  reference_sql: |
    SELECT s.store_name, SUM(oi.line_total) AS net_revenue
    FROM ${catalog}.sales.order_items oi
    JOIN ${catalog}.sales.orders o ON o.order_id = oi.order_id
    JOIN ${catalog}.sales.stores s ON s.store_id = o.store_id
    WHERE o.status <> 'Cancelled' AND year(o.order_date) = 2025
    GROUP BY s.store_name
    ORDER BY net_revenue DESC
    LIMIT 5

- id: h2-13
  domain: hr
  question: >-
    What is the average salary of active employees at each job level? Order the result from L1 to L7.
  order_matters: true
  reference_sql: |
    SELECT job_level, ROUND(AVG(salary), 2) AS avg_salary
    FROM ${catalog}.hr.employees WHERE status = 'Active'
    GROUP BY job_level ORDER BY job_level

- id: h2-14
  domain: hr
  question: >-
    For active employees, what is the average tenure in years in each department as of 2026-06-30, where tenure
    in years is the number of days since hire date divided by 365.25?
  order_matters: false
  reference_sql: |
    SELECT d.dept_name, ROUND(AVG(datediff(DATE'2026-06-30', e.hire_date) / 365.25), 2) AS avg_tenure_years
    FROM ${catalog}.hr.employees e JOIN ${catalog}.hr.departments d ON d.dept_id = e.dept_id
    WHERE e.status = 'Active'
    GROUP BY d.dept_name

- id: h2-15
  domain: hr
  question: >-
    For each department, how does its number of active employees compare with its headcount budget? Show the
    department, active headcount, headcount budget and the difference (active minus budget).
  order_matters: false
  reference_sql: |
    SELECT d.dept_name, COUNT(e.emp_id) AS active_headcount, d.headcount_budget,
           COUNT(e.emp_id) - d.headcount_budget AS difference
    FROM ${catalog}.hr.departments d
    LEFT JOIN ${catalog}.hr.employees e ON e.dept_id = d.dept_id AND e.status = 'Active'
    GROUP BY d.dept_name, d.headcount_budget

- id: h2-16
  domain: hr
  question: >-
    For weeks starting between 2026-04-01 and 2026-06-30, what were the average hours worked per employee per
    week in each department?
  order_matters: false
  reference_sql: |
    SELECT d.dept_name, ROUND(AVG(a.hours_worked), 2) AS avg_weekly_hours
    FROM ${catalog}.hr.attendance a JOIN ${catalog}.hr.departments d ON d.dept_id = a.dept_id
    WHERE a.week_start_date BETWEEN DATE'2026-04-01' AND DATE'2026-06-30'
    GROUP BY d.dept_name

- id: h2-17
  domain: hr
  question: >-
    Which 3 departments recorded the most sick leave days in weeks starting after 2025-06-30? Show department and
    total sick leave days.
  order_matters: true
  reference_sql: |
    SELECT d.dept_name, SUM(a.leave_days) AS sick_days
    FROM ${catalog}.hr.attendance a JOIN ${catalog}.hr.departments d ON d.dept_id = a.dept_id
    WHERE a.leave_type = 'Sick' AND a.week_start_date > DATE'2025-06-30'
    GROUP BY d.dept_name
    ORDER BY sick_days DESC
    LIMIT 3

- id: h2-18
  domain: hr
  question: >-
    For job changes with the reason 'Promotion', how many happened in each year (by effective date) and what was
    the average salary increase (new salary minus previous salary)?
  order_matters: false
  reference_sql: |
    SELECT year(effective_date) AS year, COUNT(*) AS promotions, ROUND(AVG(to_salary - from_salary), 2) AS avg_increase
    FROM ${catalog}.hr.job_history WHERE change_reason = 'Promotion'
    GROUP BY year(effective_date)

- id: h2-19
  domain: hr
  question: >-
    What was the total net pay in each quarter of 2025? Show the quarter number (1 to 4) and total net pay.
  order_matters: false
  reference_sql: |
    SELECT quarter(pay_period) AS quarter, SUM(net_pay) AS total_net_pay
    FROM ${catalog}.hr.payroll WHERE year(pay_period) = 2025
    GROUP BY quarter(pay_period)

- id: h2-20
  domain: hr
  question: >-
    How many employees had a higher performance rating in each of 2025-Q4, 2026-Q1 and 2026-Q2 than in the period
    immediately before (2025-Q3, 2025-Q4 and 2026-Q1 respectively)?
  order_matters: false
  reference_sql: |
    WITH p AS (
      SELECT emp_id,
             MAX(CASE WHEN review_period = '2025-Q3' THEN rating END) AS q3,
             MAX(CASE WHEN review_period = '2025-Q4' THEN rating END) AS q4,
             MAX(CASE WHEN review_period = '2026-Q1' THEN rating END) AS q1,
             MAX(CASE WHEN review_period = '2026-Q2' THEN rating END) AS q2
      FROM ${catalog}.hr.performance_reviews GROUP BY emp_id
    )
    SELECT COUNT(*) AS employees_improving_three_periods FROM p WHERE q4 > q3 AND q1 > q4 AND q2 > q1

- id: h2-21
  domain: hr
  question: >-
    For 2025 pay periods, what was total bonus pay as a percentage of total base salary in each department?
  order_matters: false
  reference_sql: |
    SELECT d.dept_name, ROUND(SUM(p.bonus_amount) * 100.0 / SUM(p.base_salary), 2) AS bonus_pct_of_base
    FROM ${catalog}.hr.payroll p JOIN ${catalog}.hr.departments d ON d.dept_id = p.dept_id
    WHERE year(p.pay_period) = 2025
    GROUP BY d.dept_name

- id: h2-22
  domain: finance
  question: >-
    For budget year 2025, which departments' total actual spend exceeded their total budget? Show department and
    the overrun (actual minus budget), largest overrun first.
  order_matters: true
  reference_sql: |
    SELECT d.dept_name, SUM(b.actual_amount) - SUM(b.budget_amount) AS overrun
    FROM ${catalog}.finance.budget_lines b JOIN ${catalog}.hr.departments d ON d.dept_id = b.dept_id
    WHERE b.budget_year = 2025
    GROUP BY d.dept_name
    HAVING SUM(b.actual_amount) > SUM(b.budget_amount)
    ORDER BY overrun DESC

- id: h2-23
  domain: finance
  question: >-
    In budget year 2025, which month had the largest total variance (actual minus budget) across all budget
    lines? Show the month number and the variance.
  order_matters: false
  reference_sql: |
    SELECT budget_month, SUM(actual_amount - budget_amount) AS variance
    FROM ${catalog}.finance.budget_lines WHERE budget_year = 2025
    GROUP BY budget_month ORDER BY variance DESC LIMIT 1

- id: h2-24
  domain: finance
  question: >-
    For paid invoices issued in 2025, what was the average number of days from invoice date to payment date in
    each quarter (by invoice date)? Show the quarter number (1 to 4) and the average days.
  order_matters: false
  reference_sql: |
    SELECT quarter(invoice_date) AS quarter, ROUND(AVG(datediff(payment_date, invoice_date)), 2) AS avg_days_to_pay
    FROM ${catalog}.finance.invoices
    WHERE invoice_status = 'Paid' AND year(invoice_date) = 2025
    GROUP BY quarter(invoice_date)

- id: h2-25
  domain: finance
  question: >-
    What is the total outstanding balance (total due minus paid amount) on invoices with status 'Overdue', by
    customer segment?
  order_matters: false
  reference_sql: |
    SELECT c.segment, SUM(i.total_due - i.paid_amount) AS overdue_balance
    FROM ${catalog}.finance.invoices i JOIN ${catalog}.sales.customers c ON c.customer_id = i.customer_id
    WHERE i.invoice_status = 'Overdue'
    GROUP BY c.segment

- id: h2-26
  domain: finance
  question: >-
    For each expense category, what is the approval rate, defined as approved expenses divided by approved plus
    rejected expenses (ignoring pending ones), as a percentage?
  order_matters: false
  reference_sql: |
    SELECT category,
           ROUND(SUM(CASE WHEN approval_status = 'Approved' THEN 1 ELSE 0 END) * 100.0
                 / SUM(CASE WHEN approval_status IN ('Approved', 'Rejected') THEN 1 ELSE 0 END), 2) AS approval_rate_pct
    FROM ${catalog}.finance.expenses
    GROUP BY category

- id: h2-27
  domain: finance
  question: >-
    Which 5 employees had the largest total approved expense amount for expenses dated in 2025? Show employee id
    and total approved amount.
  order_matters: true
  reference_sql: |
    SELECT emp_id, SUM(amount) AS approved_amount
    FROM ${catalog}.finance.expenses
    WHERE approval_status = 'Approved' AND year(expense_date) = 2025
    GROUP BY emp_id ORDER BY approved_amount DESC LIMIT 5

- id: h2-28
  domain: finance
  question: >-
    For invoices issued in 2025 that are not Void, what is the total invoice line amount by GL account name?
  order_matters: false
  reference_sql: |
    SELECT a.account_name, SUM(l.line_amount) AS line_amount
    FROM ${catalog}.finance.invoice_lines l
    JOIN ${catalog}.finance.invoices i ON i.invoice_id = l.invoice_id
    JOIN ${catalog}.finance.gl_accounts a ON a.account_id = l.account_id
    WHERE year(i.invoice_date) = 2025 AND i.invoice_status <> 'Void'
    GROUP BY a.account_name

- id: h2-29
  domain: finance
  question: >-
    For each month from January to June 2026, what was the total approved expense amount and the change versus the
    previous month? January's change is versus December 2025.
  order_matters: true
  reference_sql: |
    WITH m AS (
      SELECT date_trunc('MONTH', expense_date) AS month, SUM(amount) AS approved
      FROM ${catalog}.finance.expenses WHERE approval_status = 'Approved'
      GROUP BY ALL
    )
    SELECT month, approved, change FROM (
      SELECT month, approved, approved - LAG(approved) OVER (ORDER BY month) AS change FROM m
    ) WHERE month BETWEEN DATE'2026-01-01' AND DATE'2026-06-01'
    ORDER BY month

- id: h2-30
  domain: finance
  question: >-
    Which 3 cost centers had the largest total approved expense amount for expenses dated from 2026-01-01 to
    2026-06-30? Show cost center name and amount.
  order_matters: true
  reference_sql: |
    SELECT cc.cc_name, SUM(e.amount) AS approved_amount
    FROM ${catalog}.finance.expenses e JOIN ${catalog}.finance.cost_centers cc ON cc.cc_id = e.cc_id
    WHERE e.approval_status = 'Approved' AND e.expense_date BETWEEN DATE'2026-01-01' AND DATE'2026-06-30'
    GROUP BY cc.cc_name ORDER BY approved_amount DESC LIMIT 3
