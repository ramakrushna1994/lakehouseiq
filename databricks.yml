bundle:
  name: plumbline

variables:
  catalog:
    description: Unity Catalog catalog that holds the sales, hr, finance and app schemas.
    default: workspace
  as_of_date:
    description: Fixed "today" for the seeded data and for date-relative metric view logic (YYYY-MM-DD).
    default: "2026-06-30"
  generator_endpoint:
    description: Foundation Model API endpoint that writes the SQL.
    default: databricks-gpt-oss-120b
  judge_endpoint:
    description: Independent Foundation Model API endpoint that scores the SQL.
    default: databricks-meta-llama-3-3-70b-instruct
  genie_space_id:
    description: Optional Genie space id; when set, the eval also benchmarks Genie.
    default: ""
  warehouse_id:
    description: SQL warehouse used by the app and the eval.
    lookup:
      warehouse: "Serverless Starter Warehouse"

resources:
  jobs:
    plumbline_setup:
      name: plumbline-setup
      description: Create schemas and app tables, seed the three domains, define metric views.
      max_concurrent_runs: 1
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ./notebooks/00_setup.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: seed_sales
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ./notebooks/01_seed_sales.py
            base_parameters:
              catalog: ${var.catalog}
              as_of_date: ${var.as_of_date}
        - task_key: seed_hr
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ./notebooks/02_seed_hr.py
            base_parameters:
              catalog: ${var.catalog}
              as_of_date: ${var.as_of_date}
        - task_key: seed_finance
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ./notebooks/03_seed_finance.py
            base_parameters:
              catalog: ${var.catalog}
              as_of_date: ${var.as_of_date}
        - task_key: semantic_layer
          depends_on:
            - task_key: seed_sales
            - task_key: seed_hr
            - task_key: seed_finance
          notebook_task:
            notebook_path: ./notebooks/04_semantic_layer.py
            base_parameters:
              catalog: ${var.catalog}
              as_of_date: ${var.as_of_date}
              semantic_dir: ${workspace.file_path}/app/semantic
        - task_key: grant_app
          depends_on: [{ task_key: semantic_layer }]
          notebook_task:
            notebook_path: ./notebooks/05_grant_app.py
            base_parameters:
              catalog: ${var.catalog}
              app_name: plumbline

    plumbline_grant_app:
      name: plumbline-grant-app
      description: Grant the app's service principal read access to the data and write access to two app tables.
      max_concurrent_runs: 1
      tasks:
        - task_key: grant_app
          notebook_task:
            notebook_path: ./notebooks/05_grant_app.py
            base_parameters:
              catalog: ${var.catalog}
              app_name: plumbline

    plumbline_eval:
      name: plumbline-eval
      description: Run the curated question set through the assistant (and Genie, if configured) and score it.
      max_concurrent_runs: 1
      tasks:
        - task_key: eval
          notebook_task:
            notebook_path: ./notebooks/06_eval.py
            base_parameters:
              catalog: ${var.catalog}
              as_of_date: ${var.as_of_date}
              warehouse_id: ${var.warehouse_id}
              generator_endpoint: ${var.generator_endpoint}
              judge_endpoint: ${var.judge_endpoint}
              genie_space_id: ${var.genie_space_id}
              run_id: ""
              limit: "0"

  apps:
    plumbline:
      name: plumbline
      description: Natural-language BI assistant over Unity Catalog metric views
      source_code_path: ./app
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: generator-endpoint
          serving_endpoint:
            name: ${var.generator_endpoint}
            permission: CAN_QUERY
        - name: judge-endpoint
          serving_endpoint:
            name: ${var.judge_endpoint}
            permission: CAN_QUERY


targets:
  dev:
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
